[package]
name = "custom-rich-presence"
version = "0.2.0"
description = "Panneau de présence personnalisé pour le bureau Windows"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "custom_rich_presence_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Media",
    "Media_Control",
    "Storage_Streams",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
